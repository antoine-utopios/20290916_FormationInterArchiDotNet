<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="f" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <text x="600" y="34" text-anchor="middle" font-size="26" font-weight="bold" fill="#333">Le front de Trame 2 : trois clients, une seule API, deux annuaires</text>

  <!-- Clients -->
  <rect x="40" y="62" width="330" height="92" rx="12" fill="#eaf6da" stroke="#8CC63F" stroke-width="2.5"/>
  <text x="205" y="88" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Extranet clients</text>
  <text x="205" y="111" text-anchor="middle" font-size="15" fill="#555">Blazor Web App, InteractiveServer</text>
  <text x="205" y="132" text-anchor="middle" font-size="15" fill="#555">1 200 clients pro, catalogue, panier, suivi</text>

  <rect x="435" y="62" width="330" height="92" rx="12" fill="#fdf5ec" stroke="#E67E22" stroke-width="2.5"/>
  <text x="600" y="88" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Application entrepôt</text>
  <text x="600" y="111" text-anchor="middle" font-size="15" fill="#555">.NET MAUI Android sur les scanners</text>
  <text x="600" y="132" text-anchor="middle" font-size="15" fill="#555">ordres de préparation, mode déconnecté</text>

  <rect x="830" y="62" width="330" height="92" rx="12" fill="#f2f5fb" stroke="#4A90D9" stroke-width="2.5"/>
  <text x="995" y="88" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Back-office ADV et achats</text>
  <text x="995" y="111" text-anchor="middle" font-size="15" fill="#555">WinForms Trame maintenu 18 mois,</text>
  <text x="995" y="132" text-anchor="middle" font-size="15" fill="#555">écrans refaits en Blazor (ou WPF MVVM)</text>

  <!-- Flèches clients -> API -->
  <line x1="205" y1="154" x2="205" y2="238" stroke="#333" stroke-width="2.5" marker-end="url(#f)"/>
  <text x="215" y="185" font-size="14" fill="#333">appels serveur à serveur :</text>
  <text x="215" y="203" font-size="14" fill="#333">le serveur Blazor joue le BFF</text>
  <line x1="600" y1="154" x2="600" y2="238" stroke="#333" stroke-width="2.5" marker-end="url(#f)"/>
  <text x="610" y="185" font-size="14" fill="#333">HTTPS + jeton OIDC,</text>
  <text x="610" y="203" font-size="14" fill="#333">client généré par Kiota</text>
  <line x1="995" y1="154" x2="995" y2="238" stroke="#333" stroke-width="2.5" marker-end="url(#f)"/>
  <text x="985" y="185" text-anchor="end" font-size="14" fill="#333">YARP : WCF legacy ou</text>
  <text x="985" y="203" text-anchor="end" font-size="14" fill="#333">API Trame 2 (Strangler Fig)</text>

  <!-- API -->
  <rect x="150" y="240" width="900" height="70" rx="12" fill="#4A90D9" stroke="#333" stroke-width="2"/>
  <text x="600" y="268" text-anchor="middle" font-size="19" font-weight="bold" fill="#fff">API Trame 2 — ASP.NET Core 10, Minimal APIs versionnées, OpenAPI, JWT bearer</text>
  <text x="600" y="294" text-anchor="middle" font-size="15" fill="#fff">P95 &lt; 300 ms sur la consultation de stock, 99,9 % de disponibilité (module 5)</text>

  <!-- Identité -->
  <rect x="20" y="330" width="230" height="64" rx="10" fill="#f2f2f2" stroke="#333" stroke-width="2"/>
  <text x="135" y="356" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Entra External ID</text>
  <text x="135" y="378" text-anchor="middle" font-size="14" fill="#555">clients et partenaires, MFA</text>
  <rect x="950" y="330" width="230" height="64" rx="10" fill="#f2f2f2" stroke="#333" stroke-width="2"/>
  <text x="1065" y="356" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Entra ID (hybride AD)</text>
  <text x="1065" y="378" text-anchor="middle" font-size="14" fill="#555">180 salariés, préparateurs</text>
  <line x1="135" y1="330" x2="135" y2="156" stroke="#555" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#f)"/>
  <line x1="1065" y1="330" x2="1065" y2="156" stroke="#555" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#f)"/>

  <!-- Domaine -->
  <line x1="600" y1="310" x2="600" y2="328" stroke="#333" stroke-width="2.5" marker-end="url(#f)"/>
  <rect x="290" y="330" width="620" height="64" rx="12" fill="#eaf6da" stroke="#8CC63F" stroke-width="2"/>
  <text x="600" y="356" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Textinord.Trame.Domain + Application</text>
  <text x="600" y="380" text-anchor="middle" font-size="15" fill="#555">remises plafonnées à 30 %, machine à états, ordres de préparation par entrepôt</text>

  <!-- Infra -->
  <line x1="600" y1="394" x2="600" y2="426" stroke="#333" stroke-width="2.5" marker-end="url(#f)"/>
  <rect x="200" y="430" width="240" height="64" rx="10" fill="#f2f2f2" stroke="#333" stroke-width="2"/>
  <text x="320" y="456" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Azure SQL — EF Core 10</text>
  <text x="320" y="478" text-anchor="middle" font-size="14" fill="#555">commandes, clients (module 4)</text>
  <rect x="480" y="430" width="240" height="64" rx="10" fill="#f2f2f2" stroke="#333" stroke-width="2"/>
  <text x="600" y="456" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Cosmos DB + Redis</text>
  <text x="600" y="478" text-anchor="middle" font-size="14" fill="#555">catalogue 40 000 réf., cache</text>
  <rect x="760" y="430" width="240" height="64" rx="10" fill="#f2f2f2" stroke="#333" stroke-width="2"/>
  <text x="880" y="456" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Azure Service Bus</text>
  <text x="880" y="478" text-anchor="middle" font-size="14" fill="#555">topics commandes, preparations</text>

  <text x="600" y="536" text-anchor="middle" font-size="17" fill="#555">Aucun client ne parle à la base : la règle métier vit une seule fois, derrière l'API</text>
</svg>
