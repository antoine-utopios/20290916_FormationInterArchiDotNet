<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="fleche" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <text x="600" y="34" text-anchor="middle" font-size="24" font-weight="bold" fill="#333">Du 2-tiers aux micro-services : chaque style ajoute une frontière, et son coût</text>

  <!-- Colonne 1 : 2-tiers -->
  <text x="165" y="72" text-anchor="middle" font-size="19" font-weight="bold" fill="#333">2-tiers — Trame (2011)</text>
  <rect x="30" y="90" width="270" height="64" rx="10" fill="#f2f2f2" stroke="#333" stroke-width="2"/>
  <text x="165" y="116" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">Client lourd WinForms</text>
  <text x="165" y="140" text-anchor="middle" font-size="15" fill="#555">IHM + règles métier + SQL</text>
  <line x1="165" y1="154" x2="165" y2="188" stroke="#333" stroke-width="2" marker-end="url(#fleche)"/>
  <rect x="30" y="192" width="270" height="64" rx="10" fill="#f2f2f2" stroke="#333" stroke-width="2"/>
  <text x="165" y="218" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">SQL Server 2016</text>
  <text x="165" y="242" text-anchor="middle" font-size="15" fill="#555">400 procédures, triggers</text>
  <text x="165" y="336" text-anchor="middle" font-size="15" font-style="italic" fill="#E67E22">Règles dupliquées,</text>
  <text x="165" y="356" text-anchor="middle" font-size="15" font-style="italic" fill="#E67E22">tests impossibles</text>

  <!-- Colonne 2 : 3-tiers / n-tiers -->
  <text x="455" y="72" text-anchor="middle" font-size="19" font-weight="bold" fill="#333">3-tiers / n-tiers</text>
  <rect x="320" y="90" width="270" height="54" rx="10" fill="#f2f2f2" stroke="#333" stroke-width="2"/>
  <text x="455" y="112" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">Présentation</text>
  <text x="455" y="134" text-anchor="middle" font-size="15" fill="#555">Blazor, MAUI, API</text>
  <line x1="455" y1="144" x2="455" y2="164" stroke="#333" stroke-width="2" marker-end="url(#fleche)"/>
  <rect x="320" y="168" width="270" height="54" rx="10" fill="#f2f5fb" stroke="#4A90D9" stroke-width="2"/>
  <text x="455" y="190" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">Serveur applicatif</text>
  <text x="455" y="212" text-anchor="middle" font-size="15" fill="#555">règles métier centralisées</text>
  <line x1="455" y1="222" x2="455" y2="242" stroke="#333" stroke-width="2" marker-end="url(#fleche)"/>
  <rect x="320" y="246" width="270" height="54" rx="10" fill="#f2f2f2" stroke="#333" stroke-width="2"/>
  <text x="455" y="268" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">Base de données</text>
  <text x="455" y="290" text-anchor="middle" font-size="15" fill="#555">sans logique métier</text>
  <text x="455" y="346" text-anchor="middle" font-size="15" font-style="italic" fill="#4A90D9">La première marche de Trame 2</text>

  <!-- Colonne 3 : SOA / ESB -->
  <text x="745" y="72" text-anchor="middle" font-size="19" font-weight="bold" fill="#333">SOA, ESB, web services</text>
  <rect x="610" y="90" width="270" height="54" rx="10" fill="#f2f2f2" stroke="#333" stroke-width="2"/>
  <text x="745" y="112" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">Consommateurs</text>
  <text x="745" y="134" text-anchor="middle" font-size="15" fill="#555">ADV, extranet, ERP, EDI</text>
  <line x1="745" y1="144" x2="745" y2="164" stroke="#333" stroke-width="2" marker-end="url(#fleche)"/>
  <rect x="610" y="168" width="270" height="54" rx="10" fill="#4A90D9" stroke="#333" stroke-width="2"/>
  <text x="745" y="190" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff">ESB / bus de services</text>
  <text x="745" y="212" text-anchor="middle" font-size="14" fill="#fff">routage, contrats, transformation</text>
  <line x1="651" y1="222" x2="651" y2="244" stroke="#333" stroke-width="2"/>
  <line x1="745" y1="222" x2="745" y2="244" stroke="#333" stroke-width="2"/>
  <line x1="839" y1="222" x2="839" y2="244" stroke="#333" stroke-width="2"/>
  <rect x="610" y="246" width="82" height="54" rx="8" fill="#f2f2f2" stroke="#333" stroke-width="2"/>
  <text x="651" y="267" text-anchor="middle" font-size="13" fill="#555">Service</text>
  <text x="651" y="287" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">commandes</text>
  <rect x="704" y="246" width="82" height="54" rx="8" fill="#f2f2f2" stroke="#333" stroke-width="2"/>
  <text x="745" y="267" text-anchor="middle" font-size="13" fill="#555">Service</text>
  <text x="745" y="287" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">stock</text>
  <rect x="798" y="246" width="82" height="54" rx="8" fill="#f2f2f2" stroke="#333" stroke-width="2"/>
  <text x="839" y="267" text-anchor="middle" font-size="13" fill="#555">Service</text>
  <text x="839" y="287" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">tarif</text>
  <text x="745" y="346" text-anchor="middle" font-size="15" font-style="italic" fill="#4A90D9">Contrats et réutilisation</text>

  <!-- Colonne 4 : micro-services -->
  <text x="1035" y="72" text-anchor="middle" font-size="19" font-weight="bold" fill="#333">Micro-services, event-driven</text>
  <rect x="900" y="90" width="270" height="44" rx="10" fill="#f2f2f2" stroke="#333" stroke-width="2"/>
  <text x="1035" y="118" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">API gateway (YARP)</text>
  <line x1="942" y1="134" x2="942" y2="156" stroke="#333" stroke-width="2"/>
  <line x1="1035" y1="134" x2="1035" y2="156" stroke="#333" stroke-width="2"/>
  <line x1="1128" y1="134" x2="1128" y2="156" stroke="#333" stroke-width="2"/>
  <rect x="900" y="156" width="82" height="50" rx="8" fill="#eaf6da" stroke="#8CC63F" stroke-width="2"/>
  <text x="941" y="186" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Commandes</text>
  <rect x="994" y="156" width="82" height="50" rx="8" fill="#eaf6da" stroke="#8CC63F" stroke-width="2"/>
  <text x="1035" y="186" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Préparation</text>
  <rect x="1088" y="156" width="82" height="50" rx="8" fill="#eaf6da" stroke="#8CC63F" stroke-width="2"/>
  <text x="1129" y="186" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Catalogue</text>
  <line x1="942" y1="206" x2="942" y2="246" stroke="#333" stroke-width="2" stroke-dasharray="5,4"/>
  <line x1="1035" y1="206" x2="1035" y2="246" stroke="#333" stroke-width="2" stroke-dasharray="5,4"/>
  <line x1="1128" y1="206" x2="1128" y2="246" stroke="#333" stroke-width="2" stroke-dasharray="5,4"/>
  <rect x="900" y="246" width="270" height="40" rx="10" fill="#8CC63F" stroke="#333" stroke-width="2"/>
  <text x="1035" y="272" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">Bus d'événements (Service Bus)</text>
  <text x="1035" y="310" text-anchor="middle" font-size="13" fill="#555">Une base et un déploiement par service</text>
  <text x="1035" y="346" text-anchor="middle" font-size="14" font-style="italic" fill="#E67E22">Autonomie ; exploitation complexe</text>

  <!-- Axe -->
  <line x1="165" y1="384" x2="1030" y2="384" stroke="#333" stroke-width="2" marker-end="url(#fleche)"/>
  <text x="165" y="376" text-anchor="start" font-size="14" fill="#555">couplage fort, simplicité</text>
  <text x="1035" y="376" text-anchor="end" font-size="14" fill="#555">autonomie, complexité</text>

  <!-- Bandeau critères -->
  <rect x="30" y="398" width="1140" height="66" rx="12" fill="#f2f5fb"/>
  <text x="50" y="424" font-size="16" font-weight="bold" fill="#333">Plus on va vers la droite :</text>
  <text x="50" y="450" font-size="15" fill="#333">+ autonomie de déploiement, + scalabilité par composant, + résilience   |   + réseau, + données réparties, + exploitation, + compétences</text>

  <text x="600" y="520" text-anchor="middle" font-size="16" fill="#555">Textinord (6 développeurs, 900 commandes / jour) retient le monolithe modulaire en couches ; les micro-services attendront</text>
</svg>
