<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="Segoe UI, Arial, sans-serif">
  <text x="600" y="34" text-anchor="middle" font-size="26" font-weight="bold" fill="#333">Choisir le stockage : quatre familles, une question chacune</text>

  <!-- Colonne 1 : relationnel -->
  <rect x="30" y="58" width="270" height="62" rx="10" fill="#4A90D9" stroke="#333" stroke-width="2"/>
  <text x="165" y="84" text-anchor="middle" font-size="19" font-weight="bold" fill="#fff">Relationnel (SQL)</text>
  <text x="165" y="108" text-anchor="middle" font-size="14" fill="#fff">Azure SQL, SQL Server, PostgreSQL</text>
  <rect x="30" y="128" width="270" height="270" rx="10" fill="#f2f2f2" stroke="#ccc" stroke-width="1.5"/>
  <text x="45" y="153" font-size="16" font-weight="bold" fill="#333">Forces</text>
  <text x="45" y="176" font-size="15" fill="#444">ACID sur plusieurs tables</text>
  <text x="45" y="198" font-size="15" fill="#444">jointures, contraintes, index</text>
  <text x="45" y="220" font-size="15" fill="#444">40 ans d'outillage et de SQL</text>
  <text x="45" y="254" font-size="16" font-weight="bold" fill="#333">Limites</text>
  <text x="45" y="277" font-size="15" fill="#444">schéma à faire migrer</text>
  <text x="45" y="299" font-size="15" fill="#444">scalabilité verticale d'abord</text>
  <text x="45" y="333" font-size="16" font-weight="bold" fill="#4A90D9">Chez Textinord</text>
  <text x="45" y="356" font-size="15" fill="#444">commandes, clients, factures,</text>
  <text x="45" y="378" font-size="15" fill="#444">stock (source de vérité)</text>
  <rect x="30" y="408" width="270" height="56" rx="8" fill="#f2f5fb" stroke="#4A90D9" stroke-width="1.5"/>
  <text x="165" y="431" text-anchor="middle" font-size="15" fill="#333">Faut-il des transactions</text>
  <text x="165" y="452" text-anchor="middle" font-size="15" fill="#333">et des jointures ? Oui : ici.</text>

  <!-- Colonne 2 : document -->
  <rect x="320" y="58" width="270" height="62" rx="10" fill="#8CC63F" stroke="#333" stroke-width="2"/>
  <text x="455" y="84" text-anchor="middle" font-size="19" font-weight="bold" fill="#fff">Document</text>
  <text x="455" y="108" text-anchor="middle" font-size="14" fill="#fff">Azure Cosmos DB, MongoDB</text>
  <rect x="320" y="128" width="270" height="270" rx="10" fill="#f2f2f2" stroke="#ccc" stroke-width="1.5"/>
  <text x="335" y="153" font-size="16" font-weight="bold" fill="#333">Forces</text>
  <text x="335" y="176" font-size="15" fill="#444">un agrégat = un document JSON</text>
  <text x="335" y="198" font-size="15" fill="#444">schéma souple par document</text>
  <text x="335" y="220" font-size="15" fill="#444">partition horizontale native</text>
  <text x="335" y="254" font-size="16" font-weight="bold" fill="#333">Limites</text>
  <text x="335" y="277" font-size="15" fill="#444">pas de jointure native</text>
  <text x="335" y="299" font-size="15" fill="#444">transaction par partition</text>
  <text x="335" y="333" font-size="16" font-weight="bold" fill="#6a9a1f">Chez Textinord</text>
  <text x="335" y="356" font-size="15" fill="#444">catalogue 40 000 références,</text>
  <text x="335" y="378" font-size="15" fill="#444">fiches article de l'extranet</text>
  <rect x="320" y="408" width="270" height="56" rx="8" fill="#eaf6da" stroke="#8CC63F" stroke-width="1.5"/>
  <text x="455" y="431" text-anchor="middle" font-size="15" fill="#333">Lit-on toujours l'objet entier,</text>
  <text x="455" y="452" text-anchor="middle" font-size="15" fill="#333">avec un schéma variable ?</text>

  <!-- Colonne 3 : clé-valeur -->
  <rect x="610" y="58" width="270" height="62" rx="10" fill="#E67E22" stroke="#333" stroke-width="2"/>
  <text x="745" y="84" text-anchor="middle" font-size="19" font-weight="bold" fill="#fff">Clé-valeur</text>
  <text x="745" y="108" text-anchor="middle" font-size="14" fill="#fff">Redis, Azure Cache for Redis</text>
  <rect x="610" y="128" width="270" height="270" rx="10" fill="#f2f2f2" stroke="#ccc" stroke-width="1.5"/>
  <text x="625" y="153" font-size="16" font-weight="bold" fill="#333">Forces</text>
  <text x="625" y="176" font-size="15" fill="#444">latence inférieure à 1 ms</text>
  <text x="625" y="198" font-size="15" fill="#444">expiration (TTL) intégrée</text>
  <text x="625" y="220" font-size="15" fill="#444">structures : hash, liste, set</text>
  <text x="625" y="254" font-size="16" font-weight="bold" fill="#333">Limites</text>
  <text x="625" y="277" font-size="15" fill="#444">accès par clé seulement</text>
  <text x="625" y="299" font-size="15" fill="#444">en mémoire : donnée jetable</text>
  <text x="625" y="333" font-size="16" font-weight="bold" fill="#E67E22">Chez Textinord</text>
  <text x="625" y="356" font-size="15" fill="#444">panier extranet, sessions,</text>
  <text x="625" y="378" font-size="15" fill="#444">cache de consultation stock</text>
  <rect x="610" y="408" width="270" height="56" rx="8" fill="#fdf5ec" stroke="#E67E22" stroke-width="1.5"/>
  <text x="745" y="431" text-anchor="middle" font-size="15" fill="#333">Peut-on la perdre et la</text>
  <text x="745" y="452" text-anchor="middle" font-size="15" fill="#333">recalculer ? Alors elle va ici.</text>

  <!-- Colonne 4 : colonnes larges et graphe -->
  <rect x="900" y="58" width="270" height="62" rx="10" fill="#333" stroke="#333" stroke-width="2"/>
  <text x="1035" y="84" text-anchor="middle" font-size="19" font-weight="bold" fill="#fff">Colonnes larges, graphe</text>
  <text x="1035" y="108" text-anchor="middle" font-size="14" fill="#fff">Cassandra, Cosmos DB (Gremlin)</text>
  <rect x="900" y="128" width="270" height="270" rx="10" fill="#f2f2f2" stroke="#ccc" stroke-width="1.5"/>
  <text x="915" y="153" font-size="16" font-weight="bold" fill="#333">Forces</text>
  <text x="915" y="176" font-size="15" fill="#444">écritures massives, séries</text>
  <text x="915" y="198" font-size="15" fill="#444">temporelles (colonnes larges)</text>
  <text x="915" y="220" font-size="15" fill="#444">relations profondes (graphe)</text>
  <text x="915" y="254" font-size="16" font-weight="bold" fill="#333">Limites</text>
  <text x="915" y="277" font-size="15" fill="#444">modélisation par requête</text>
  <text x="915" y="299" font-size="15" fill="#444">compétences rares, coûteux</text>
  <text x="915" y="333" font-size="16" font-weight="bold" fill="#333">Chez Textinord</text>
  <text x="915" y="356" font-size="15" fill="#444">15 000 mouvements / jour :</text>
  <text x="915" y="378" font-size="15" fill="#444">SQL suffit, graphe hors sujet</text>
  <rect x="900" y="408" width="270" height="56" rx="8" fill="#f2f2f2" stroke="#333" stroke-width="1.5"/>
  <text x="1035" y="431" text-anchor="middle" font-size="15" fill="#333">Volume ou relations tels que</text>
  <text x="1035" y="452" text-anchor="middle" font-size="15" fill="#333">SQL ne suit plus ? Rarement.</text>

  <text x="600" y="500" text-anchor="middle" font-size="18" fill="#555">Règle Trame 2 : SQL par défaut ; un autre moteur seulement quand sa question reçoit « oui »,</text>
  <text x="600" y="526" text-anchor="middle" font-size="18" fill="#555">et jamais deux sources de vérité pour la même donnée (le catalogue Cosmos DB est une copie publiée).</text>
</svg>
