<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="Segoe UI, Arial, sans-serif">
  <text x="600" y="34" text-anchor="middle" font-size="26" font-weight="bold" fill="#333">Choisir un protocole pour Trame 2 : un besoin, un style, pas de « tout REST »</text>

  <!-- En-tête du tableau -->
  <rect x="20" y="56" width="200" height="40" rx="8" fill="#333"/>
  <text x="120" y="82" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">Protocole</text>
  <rect x="230" y="56" width="330" height="40" rx="8" fill="#333"/>
  <text x="395" y="82" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">Quand il est le bon choix</text>
  <rect x="570" y="56" width="300" height="40" rx="8" fill="#333"/>
  <text x="720" y="82" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">Dans Trame 2</text>
  <rect x="880" y="56" width="300" height="40" rx="8" fill="#333"/>
  <text x="1030" y="82" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">Pas pour</text>

  <!-- Ligne 1 : REST -->
  <rect x="20" y="106" width="200" height="78" rx="8" fill="#8CC63F"/>
  <text x="120" y="139" text-anchor="middle" font-size="19" font-weight="bold" fill="#fff">REST + OpenAPI</text>
  <text x="120" y="164" text-anchor="middle" font-size="15" fill="#fff">JSON sur HTTP</text>
  <rect x="230" y="106" width="330" height="78" rx="8" fill="#eaf6da" stroke="#8CC63F" stroke-width="2"/>
  <text x="245" y="134" font-size="16" fill="#333">Ressources publiques, clients variés</text>
  <text x="245" y="156" font-size="16" fill="#333">(navigateur, mobile, partenaires),</text>
  <text x="245" y="176" font-size="16" fill="#333">contrat lisible et outillé</text>
  <rect x="570" y="106" width="300" height="78" rx="8" fill="#f2f2f2"/>
  <text x="585" y="134" font-size="16" fill="#333">API commandes, catalogue,</text>
  <text x="585" y="156" font-size="16" fill="#333">extranet Blazor, scanners MAUI,</text>
  <text x="585" y="176" font-size="16" fill="#333">20 grands comptes EDI</text>
  <rect x="880" y="106" width="300" height="78" rx="8" fill="#f2f2f2"/>
  <text x="895" y="134" font-size="16" fill="#555">Flux temps réel, appels</text>
  <text x="895" y="156" font-size="16" fill="#555">internes très fréquents</text>
  <text x="895" y="176" font-size="16" fill="#555">(15 000 mouvements / jour)</text>

  <!-- Ligne 2 : gRPC -->
  <rect x="20" y="194" width="200" height="78" rx="8" fill="#4A90D9"/>
  <text x="120" y="227" text-anchor="middle" font-size="19" font-weight="bold" fill="#fff">gRPC</text>
  <text x="120" y="252" text-anchor="middle" font-size="15" fill="#fff">Protobuf sur HTTP/2</text>
  <rect x="230" y="194" width="330" height="78" rx="8" fill="#f2f5fb" stroke="#4A90D9" stroke-width="2"/>
  <text x="245" y="222" font-size="16" fill="#333">Service à service, contrat strict,</text>
  <text x="245" y="244" font-size="16" fill="#333">volume élevé, latence faible,</text>
  <text x="245" y="264" font-size="16" fill="#333">streaming bidirectionnel</text>
  <rect x="570" y="194" width="300" height="78" rx="8" fill="#f2f2f2"/>
  <text x="585" y="222" font-size="16" fill="#333">Service stock interrogé par</text>
  <text x="585" y="244" font-size="16" fill="#333">l'API et le worker : P95 &lt; 300 ms</text>
  <text x="585" y="264" font-size="16" fill="#333">sur la consultation de stock</text>
  <rect x="880" y="194" width="300" height="78" rx="8" fill="#f2f2f2"/>
  <text x="895" y="222" font-size="16" fill="#555">Navigateurs (gRPC-Web à part),</text>
  <text x="895" y="244" font-size="16" fill="#555">partenaires non outillés,</text>
  <text x="895" y="264" font-size="16" fill="#555">API publique</text>

  <!-- Ligne 3 : SignalR -->
  <rect x="20" y="282" width="200" height="78" rx="8" fill="#E67E22"/>
  <text x="120" y="315" text-anchor="middle" font-size="19" font-weight="bold" fill="#fff">SignalR</text>
  <text x="120" y="340" text-anchor="middle" font-size="15" fill="#fff">WebSocket, serveur → client</text>
  <rect x="230" y="282" width="330" height="78" rx="8" fill="#fdf5ec" stroke="#E67E22" stroke-width="2"/>
  <text x="245" y="310" font-size="16" fill="#333">Notifications poussées vers</text>
  <text x="245" y="332" font-size="16" fill="#333">une interface : mises à jour</text>
  <text x="245" y="352" font-size="16" fill="#333">d'écran sans rechargement</text>
  <rect x="570" y="282" width="300" height="78" rx="8" fill="#f2f2f2"/>
  <text x="585" y="310" font-size="16" fill="#333">Suivi de commande en direct</text>
  <text x="585" y="332" font-size="16" fill="#333">dans l'extranet, tableau de bord</text>
  <text x="585" y="352" font-size="16" fill="#333">de Marc à Lesquin</text>
  <rect x="880" y="282" width="300" height="78" rx="8" fill="#f2f2f2"/>
  <text x="895" y="310" font-size="16" fill="#555">Échanges fiables entre</text>
  <text x="895" y="332" font-size="16" fill="#555">systèmes : pas de garantie</text>
  <text x="895" y="352" font-size="16" fill="#555">de livraison, pas de rejeu</text>

  <!-- Ligne 4 : GraphQL -->
  <rect x="20" y="370" width="200" height="78" rx="8" fill="#6d6d6d"/>
  <text x="120" y="403" text-anchor="middle" font-size="19" font-weight="bold" fill="#fff">GraphQL</text>
  <text x="120" y="428" text-anchor="middle" font-size="15" fill="#fff">schéma, requête client</text>
  <rect x="230" y="370" width="330" height="78" rx="8" fill="#f2f2f2" stroke="#6d6d6d" stroke-width="2"/>
  <text x="245" y="398" font-size="16" fill="#333">Front qui agrège beaucoup de</text>
  <text x="245" y="420" font-size="16" fill="#333">données liées, besoins d'écran</text>
  <text x="245" y="440" font-size="16" fill="#333">changeants, un seul point d'entrée</text>
  <rect x="570" y="370" width="300" height="78" rx="8" fill="#f2f2f2"/>
  <text x="585" y="398" font-size="16" fill="#333">Écarté pour la v1 : BFF de</text>
  <text x="585" y="420" font-size="16" fill="#333">l'extranet suffisant (module 3),</text>
  <text x="585" y="440" font-size="16" fill="#333">réévalué si le catalogue grossit</text>
  <rect x="880" y="370" width="300" height="78" rx="8" fill="#f2f2f2"/>
  <text x="895" y="398" font-size="16" fill="#555">Écritures transactionnelles,</text>
  <text x="895" y="420" font-size="16" fill="#555">cache HTTP, partenaires EDI,</text>
  <text x="895" y="440" font-size="16" fill="#555">équipes sans expérience du sujet</text>

  <!-- Ligne 5 : Messaging -->
  <rect x="20" y="458" width="200" height="78" rx="8" fill="#333"/>
  <text x="120" y="491" text-anchor="middle" font-size="19" font-weight="bold" fill="#fff">Messaging</text>
  <text x="120" y="516" text-anchor="middle" font-size="15" fill="#fff">Service Bus, RabbitMQ</text>
  <rect x="230" y="458" width="330" height="78" rx="8" fill="#f2f2f2" stroke="#333" stroke-width="2"/>
  <text x="245" y="486" font-size="16" fill="#333">Découplage temporel, traitement</text>
  <text x="245" y="508" font-size="16" fill="#333">garanti, plusieurs consommateurs,</text>
  <text x="245" y="528" font-size="16" fill="#333">pics de charge à lisser</text>
  <rect x="570" y="458" width="300" height="78" rx="8" fill="#f2f2f2"/>
  <text x="585" y="486" font-size="16" fill="#333">Ordres de préparation vers</text>
  <text x="585" y="508" font-size="16" fill="#333">Roubaix et Lesquin, topics</text>
  <text x="585" y="528" font-size="16" fill="#333">commandes et preparations</text>
  <rect x="880" y="458" width="300" height="78" rx="8" fill="#f2f2f2"/>
  <text x="895" y="486" font-size="16" fill="#555">Question-réponse immédiate</text>
  <text x="895" y="508" font-size="16" fill="#555">(« ce client existe-t-il ? »),</text>
  <text x="895" y="528" font-size="16" fill="#555">lecture à l'écran</text>

  <text x="600" y="554" text-anchor="middle" font-size="15" fill="#555">Modules 2 et 6 pour le messaging ; module 3 pour le BFF de l'extranet — ici, on tranche le protocole exposé par l'API.</text>
</svg>
