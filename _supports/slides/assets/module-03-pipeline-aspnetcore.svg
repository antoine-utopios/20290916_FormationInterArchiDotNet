<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="f" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <text x="600" y="34" text-anchor="middle" font-size="26" font-weight="bold" fill="#333">Le pipeline ASP.NET Core : une chaîne de middlewares, puis l'endpoint</text>

  <g transform="translate(0,-95)">
<!-- Requête entrante -->
  <text x="10" y="200" font-size="15" font-weight="bold" fill="#333">Requête</text>
  <text x="10" y="218" font-size="12" fill="#555">GET /commandes</text>
  <line x1="10" y1="232" x2="106" y2="232" stroke="#333" stroke-width="2.5" marker-end="url(#f)"/>

  <!-- Chaîne de middlewares : 8 boîtes de 120 px, pas de 132 px, départ x=110 -->
  <g font-size="14" font-weight="bold" fill="#333">
    <rect x="110" y="200" width="120" height="60" rx="8" fill="#fdf5ec" stroke="#E67E22" stroke-width="2"/>
    <text x="170" y="226" text-anchor="middle">Exception</text>
    <text x="170" y="246" text-anchor="middle">handler</text>
    <rect x="242" y="200" width="120" height="60" rx="8" fill="#f2f2f2" stroke="#333" stroke-width="2"/>
    <text x="302" y="226" text-anchor="middle">HTTPS</text>
    <text x="302" y="246" text-anchor="middle">HSTS</text>
    <rect x="374" y="200" width="120" height="60" rx="8" fill="#f2f2f2" stroke="#333" stroke-width="2"/>
    <text x="434" y="226" text-anchor="middle">Static</text>
    <text x="434" y="246" text-anchor="middle">assets</text>
    <rect x="506" y="200" width="120" height="60" rx="8" fill="#f2f5fb" stroke="#4A90D9" stroke-width="2"/>
    <text x="566" y="236" text-anchor="middle">Routing</text>
    <rect x="638" y="200" width="120" height="60" rx="8" fill="#f2f2f2" stroke="#333" stroke-width="2"/>
    <text x="698" y="236" text-anchor="middle">CORS</text>
    <rect x="770" y="200" width="120" height="60" rx="8" fill="#f2f5fb" stroke="#4A90D9" stroke-width="2"/>
    <text x="830" y="236" text-anchor="middle">Authentication</text>
    <rect x="902" y="200" width="120" height="60" rx="8" fill="#f2f5fb" stroke="#4A90D9" stroke-width="2"/>
    <text x="962" y="236" text-anchor="middle">Authorization</text>
    <rect x="1034" y="200" width="120" height="60" rx="8" fill="#f2f2f2" stroke="#333" stroke-width="2"/>
    <text x="1094" y="236" text-anchor="middle">Antiforgery</text>
  </g>
  <g stroke="#333" stroke-width="2.5" marker-end="url(#f)">
    <line x1="230" y1="230" x2="240" y2="230"/>
    <line x1="362" y1="230" x2="372" y2="230"/>
    <line x1="494" y1="230" x2="504" y2="230"/>
    <line x1="626" y1="230" x2="636" y2="230"/>
    <line x1="758" y1="230" x2="768" y2="230"/>
    <line x1="890" y1="230" x2="900" y2="230"/>
    <line x1="1022" y1="230" x2="1032" y2="230"/>
  </g>
  <g font-size="12" fill="#555" text-anchor="middle">
    <text x="170" y="284">UseExceptionHandler</text>
    <text x="302" y="284">UseHttpsRedirection</text>
    <text x="434" y="284">MapStaticAssets</text>
    <text x="566" y="284">UseRouting</text>
    <text x="698" y="284">UseCors</text>
    <text x="830" y="284">UseAuthentication</text>
    <text x="962" y="284">UseAuthorization</text>
    <text x="1094" y="284">UseAntiforgery</text>
  </g>

  <!-- Descente vers l'endpoint -->
  <line x1="1094" y1="260" x2="1094" y2="300" stroke="#333" stroke-width="2.5"/>
  <line x1="1094" y1="300" x2="600" y2="300" stroke="#333" stroke-width="2.5"/>
  <line x1="600" y1="300" x2="600" y2="328" stroke="#333" stroke-width="2.5" marker-end="url(#f)"/>
  <text x="850" y="322" text-anchor="middle" font-size="14" fill="#555">chaque middleware peut court-circuiter (401, 403, 404, fichier statique)</text>

  <!-- Endpoint -->
  <rect x="150" y="330" width="900" height="72" rx="12" fill="#4A90D9" stroke="#333" stroke-width="2"/>
  <text x="600" y="358" text-anchor="middle" font-size="19" font-weight="bold" fill="#fff">Endpoint sélectionné par le routing</text>
  <text x="600" y="385" text-anchor="middle" font-size="15" fill="#fff">action MVC (avec ses filtres) · handler Razor Page · composant Blazor · Minimal API (endpoint filters)</text>

  <!-- Réponse : remonte à gauche -->
  <line x1="150" y1="366" x2="40" y2="366" stroke="#333" stroke-width="2.5"/>
  <line x1="40" y1="366" x2="40" y2="268" stroke="#333" stroke-width="2.5" marker-end="url(#f)"/>
  <text x="48" y="340" font-size="15" font-weight="bold" fill="#333">Réponse</text>
  <text x="48" y="357" font-size="12" fill="#555">remonte la chaîne</text>

  <!-- Filtres MVC -->
  <rect x="150" y="420" width="900" height="50" rx="10" fill="#eaf6da" stroke="#8CC63F" stroke-width="2"/>
  <text x="600" y="441" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">Filtres MVC, dans l'ordre : Authorization → Resource → Action (model binding, validation) → Exception → Result</text>
  <text x="600" y="461" text-anchor="middle" font-size="14" fill="#555">un filtre s'applique à une action, un contrôleur ou globalement (AddControllersWithViews(o =&gt; o.Filters.Add...))</text>

  </g>
<text x="600" y="462" text-anchor="middle" font-size="17" fill="#555">L'ordre des Use...() dans Program.cs est l'ordre d'exécution : Routing avant CORS et Authentication,</text>
  <text x="600" y="488" text-anchor="middle" font-size="17" fill="#555">Authentication avant Authorization, Antiforgery avant les endpoints qui reçoivent des formulaires</text>
</svg>
