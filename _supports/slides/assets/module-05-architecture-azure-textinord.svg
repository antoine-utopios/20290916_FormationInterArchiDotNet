<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="fl" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <text x="600" y="30" text-anchor="middle" font-size="26" font-weight="bold" fill="#333">Trame 2 sur Azure : micro-services sur Container Apps, données PaaS, identité Entra</text>

  <!-- Colonne clients -->
  <text x="110" y="70" text-anchor="middle" font-size="16" font-weight="bold" fill="#555">Clients</text>
  <rect x="20" y="82" width="180" height="50" rx="8" fill="#f2f2f2" stroke="#333" stroke-width="2"/>
  <text x="110" y="103" text-anchor="middle" font-size="15" fill="#333">Extranet (navigateur)</text>
  <text x="110" y="122" text-anchor="middle" font-size="14" fill="#555">1 200 clients pros</text>
  <rect x="20" y="146" width="180" height="50" rx="8" fill="#f2f2f2" stroke="#333" stroke-width="2"/>
  <text x="110" y="167" text-anchor="middle" font-size="15" fill="#333">Scanners MAUI</text>
  <text x="110" y="186" text-anchor="middle" font-size="14" fill="#555">Roubaix, Lesquin</text>
  <rect x="20" y="210" width="180" height="50" rx="8" fill="#f2f2f2" stroke="#333" stroke-width="2"/>
  <text x="110" y="231" text-anchor="middle" font-size="15" fill="#333">Partenaires EDI</text>
  <text x="110" y="250" text-anchor="middle" font-size="14" fill="#555">20 grands comptes</text>
  <rect x="20" y="274" width="180" height="50" rx="8" fill="#fdf5ec" stroke="#E67E22" stroke-width="2"/>
  <text x="110" y="295" text-anchor="middle" font-size="15" fill="#333">Postes WinForms</text>
  <text x="110" y="314" text-anchor="middle" font-size="14" fill="#555">Trame, 18 mois restants</text>

  <!-- Bord : Front Door + APIM -->
  <rect x="240" y="82" width="170" height="110" rx="8" fill="#4A90D9"/>
  <text x="325" y="112" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">Front Door</text>
  <text x="325" y="134" text-anchor="middle" font-size="14" fill="#fff">TLS, WAF, cache</text>
  <text x="325" y="154" text-anchor="middle" font-size="14" fill="#fff">+ YARP strangler</text>
  <text x="325" y="174" text-anchor="middle" font-size="14" fill="#fff">vers Trame legacy</text>
  <rect x="240" y="210" width="170" height="80" rx="8" fill="#4A90D9"/>
  <text x="325" y="240" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">API Management</text>
  <text x="325" y="262" text-anchor="middle" font-size="14" fill="#fff">contrat OpenAPI publié,</text>
  <text x="325" y="280" text-anchor="middle" font-size="14" fill="#fff">quotas partenaires</text>

  <!-- Flèches clients -> bord -->
  <line x1="200" y1="107" x2="236" y2="107" stroke="#333" stroke-width="2" marker-end="url(#fl)"/>
  <line x1="200" y1="171" x2="236" y2="150" stroke="#333" stroke-width="2" marker-end="url(#fl)"/>
  <line x1="200" y1="235" x2="236" y2="245" stroke="#333" stroke-width="2" marker-end="url(#fl)"/>
  <line x1="200" y1="299" x2="236" y2="180" stroke="#E67E22" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#fl)"/>

  <!-- Environnement Container Apps -->
  <rect x="450" y="70" width="380" height="270" rx="12" fill="#eaf6da" stroke="#8CC63F" stroke-width="3"/>
  <text x="640" y="96" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">Environnement Azure Container Apps</text>
  <text x="640" y="116" text-anchor="middle" font-size="14" fill="#555">images depuis ACR, 1 à N réplicas, sondes /health</text>
  <rect x="470" y="130" width="160" height="60" rx="8" fill="#8CC63F"/>
  <text x="550" y="155" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">Extranet Blazor</text>
  <text x="550" y="176" text-anchor="middle" font-size="13" fill="#fff">SSR + InteractiveServer</text>
  <rect x="650" y="130" width="160" height="60" rx="8" fill="#8CC63F"/>
  <text x="730" y="155" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">API Trame 2</text>
  <text x="730" y="176" text-anchor="middle" font-size="13" fill="#fff">Minimal API v1 / v2</text>
  <rect x="470" y="210" width="160" height="60" rx="8" fill="#8CC63F"/>
  <text x="550" y="235" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">Worker préparations</text>
  <text x="550" y="256" text-anchor="middle" font-size="13" fill="#fff">consomme le topic</text>
  <rect x="650" y="210" width="160" height="60" rx="8" fill="#8CC63F"/>
  <text x="730" y="235" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">Functions (EDI)</text>
  <text x="730" y="256" text-anchor="middle" font-size="13" fill="#fff">fichiers → commandes</text>
  <text x="640" y="300" text-anchor="middle" font-size="14" fill="#333">Local : .NET Aspire (AppHost, dashboard)</text>
  <text x="640" y="322" text-anchor="middle" font-size="14" fill="#555">Déploiement : azd up — alternative : AKS</text>

  <!-- Flèches bord -> ACA -->
  <line x1="410" y1="137" x2="446" y2="150" stroke="#333" stroke-width="2" marker-end="url(#fl)"/>
  <line x1="410" y1="250" x2="446" y2="210" stroke="#333" stroke-width="2" marker-end="url(#fl)"/>

  <!-- Colonne données / messaging -->
  <text x="1030" y="70" text-anchor="middle" font-size="16" font-weight="bold" fill="#555">Données et messages (PaaS)</text>
  <rect x="880" y="82" width="300" height="50" rx="8" fill="#f2f5fb" stroke="#4A90D9" stroke-width="2"/>
  <text x="1030" y="103" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">Azure SQL</text>
  <text x="1030" y="122" text-anchor="middle" font-size="13" fill="#555">commandes, clients — EF Core 10</text>
  <rect x="880" y="146" width="300" height="50" rx="8" fill="#f2f5fb" stroke="#4A90D9" stroke-width="2"/>
  <text x="1030" y="167" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">Cosmos DB + Redis</text>
  <text x="1030" y="186" text-anchor="middle" font-size="13" fill="#555">catalogue 40 000 réf., recherche, cache</text>
  <rect x="880" y="210" width="300" height="50" rx="8" fill="#f2f5fb" stroke="#4A90D9" stroke-width="2"/>
  <text x="1030" y="231" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">Service Bus</text>
  <text x="1030" y="250" text-anchor="middle" font-size="13" fill="#555">topics commandes, preparations</text>
  <rect x="880" y="274" width="300" height="50" rx="8" fill="#f2f5fb" stroke="#4A90D9" stroke-width="2"/>
  <text x="1030" y="295" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">Storage (blobs)</text>
  <text x="1030" y="314" text-anchor="middle" font-size="13" fill="#555">fichiers EDI, bons de livraison PDF</text>

  <!-- Flèches ACA -> données -->
  <line x1="830" y1="160" x2="876" y2="112" stroke="#333" stroke-width="2" marker-end="url(#fl)"/>
  <line x1="830" y1="175" x2="876" y2="171" stroke="#333" stroke-width="2" marker-end="url(#fl)"/>
  <line x1="830" y1="235" x2="876" y2="235" stroke="#333" stroke-width="2" marker-end="url(#fl)"/>
  <line x1="830" y1="255" x2="876" y2="295" stroke="#333" stroke-width="2" marker-end="url(#fl)"/>

  <!-- Bandeau transverse -->
  <rect x="20" y="372" width="1160" height="118" rx="12" fill="#f2f2f2" stroke="#333" stroke-width="2"/>
  <text x="600" y="398" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Services transverses</text>
  <rect x="40" y="412" width="210" height="62" rx="8" fill="#333"/>
  <text x="145" y="437" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">Entra ID + External ID</text>
  <text x="145" y="458" text-anchor="middle" font-size="13" fill="#fff">salariés (hybride AD), clients</text>
  <rect x="270" y="412" width="210" height="62" rx="8" fill="#333"/>
  <text x="375" y="437" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">Key Vault + App Config</text>
  <text x="375" y="458" text-anchor="middle" font-size="13" fill="#fff">secrets, chaînes, feature flags</text>
  <rect x="500" y="412" width="210" height="62" rx="8" fill="#333"/>
  <text x="605" y="437" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">Monitor + App Insights</text>
  <text x="605" y="458" text-anchor="middle" font-size="13" fill="#fff">OpenTelemetry, alertes P95</text>
  <rect x="730" y="412" width="210" height="62" rx="8" fill="#333"/>
  <text x="835" y="437" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">Container Registry</text>
  <text x="835" y="458" text-anchor="middle" font-size="13" fill="#fff">images dotnet publish, SBOM</text>
  <rect x="960" y="412" width="200" height="62" rx="8" fill="#333"/>
  <text x="1060" y="437" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">Azure DevOps</text>
  <text x="1060" y="458" text-anchor="middle" font-size="13" fill="#fff">pipelines YAML (module 6)</text>

  <text x="600" y="520" text-anchor="middle" font-size="15" fill="#555">Deux autres architectures de référence Azure : web n-tiers PaaS (App Service + Azure SQL) et serverless event-driven (Functions + Service Bus + Cosmos DB).</text>
  <text x="600" y="544" text-anchor="middle" font-size="15" fill="#555">Trame 2 combine la deuxième (Container Apps) et une touche de la troisième (Functions pour l'EDI).</text>
</svg>
