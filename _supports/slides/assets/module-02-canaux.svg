<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="fleche" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="flecheGris" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#aaa"/>
    </marker>
  </defs>

  <text x="600" y="36" text-anchor="middle" font-size="26" font-weight="bold" fill="#333">Deux canaux, deux sémantiques : point-à-point et publish-subscribe</text>
  <line x1="600" y1="60" x2="600" y2="450" stroke="#ccc" stroke-width="2"/>

  <!-- ===== Point-à-point ===== -->
  <text x="305" y="85" text-anchor="middle" font-size="20" font-weight="bold" fill="#4A90D9">Point-à-point : un message, un seul consommateur</text>

  <rect x="30" y="150" width="160" height="70" rx="10" fill="#333"/>
  <text x="110" y="180" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff">Émetteur</text>
  <text x="110" y="203" text-anchor="middle" font-size="14" fill="#fff">ordre de préparation</text>
  <line x1="190" y1="185" x2="213" y2="185" stroke="#333" stroke-width="2.5" marker-end="url(#fleche)"/>

  <rect x="215" y="160" width="210" height="50" rx="25" fill="#f2f5fb" stroke="#4A90D9" stroke-width="2"/>
  <rect x="236" y="176" width="18" height="18" rx="3" fill="#4A90D9"/>
  <rect x="260" y="176" width="18" height="18" rx="3" fill="#4A90D9"/>
  <rect x="284" y="176" width="18" height="18" rx="3" fill="#4A90D9"/>
  <text x="365" y="191" text-anchor="middle" font-size="15" fill="#333">file entrepot.LSQ</text>

  <rect x="470" y="105" width="110" height="44" rx="8" fill="#f2f2f2" stroke="#aaa" stroke-width="2"/>
  <text x="525" y="133" text-anchor="middle" font-size="15" fill="#777">Scanner 1</text>
  <rect x="470" y="163" width="110" height="44" rx="8" fill="#eaf6da" stroke="#8CC63F" stroke-width="2"/>
  <text x="525" y="191" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">Scanner 2</text>
  <rect x="470" y="221" width="110" height="44" rx="8" fill="#f2f2f2" stroke="#aaa" stroke-width="2"/>
  <text x="525" y="249" text-anchor="middle" font-size="15" fill="#777">Scanner 3</text>

  <path d="M425,178 L455,178 L455,127 L468,127" fill="none" stroke="#aaa" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#flecheGris)"/>
  <line x1="425" y1="185" x2="468" y2="185" stroke="#333" stroke-width="2.5" marker-end="url(#fleche)"/>
  <path d="M425,192 L455,192 L455,243 L468,243" fill="none" stroke="#aaa" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#flecheGris)"/>

  <text x="305" y="305" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">Consommateurs concurrents : chaque message est pris une seule fois</text>
  <text x="305" y="340" text-anchor="middle" font-size="15" fill="#555">Les ordres de Lesquin se répartissent entre les scanners des</text>
  <text x="305" y="362" text-anchor="middle" font-size="15" fill="#555">préparateurs de Marc Vandewalle : 3 000 lignes par jour, sans doublon.</text>
  <text x="305" y="400" text-anchor="middle" font-size="15" fill="#555">Sémantique naturelle d'un <tspan font-weight="bold">Command Message</tspan> : une intention,</text>
  <text x="305" y="422" text-anchor="middle" font-size="15" fill="#555">un destinataire, un résultat attendu.</text>

  <!-- ===== Publish-subscribe ===== -->
  <text x="895" y="85" text-anchor="middle" font-size="20" font-weight="bold" fill="#4A90D9">Publish-subscribe : un événement, tous les abonnés</text>

  <rect x="625" y="150" width="160" height="70" rx="10" fill="#333"/>
  <text x="705" y="180" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff">Émetteur</text>
  <text x="705" y="203" text-anchor="middle" font-size="14" fill="#fff">validation de commande</text>
  <line x1="785" y1="185" x2="808" y2="185" stroke="#333" stroke-width="2.5" marker-end="url(#fleche)"/>

  <rect x="810" y="160" width="215" height="50" rx="25" fill="#f2f5fb" stroke="#4A90D9" stroke-width="2"/>
  <text x="917" y="191" text-anchor="middle" font-size="15" fill="#333">topic commandes.validees</text>

  <rect x="1060" y="105" width="110" height="44" rx="8" fill="#eaf6da" stroke="#8CC63F" stroke-width="2"/>
  <text x="1115" y="133" text-anchor="middle" font-size="15" fill="#333">Préparation</text>
  <rect x="1060" y="163" width="110" height="44" rx="8" fill="#eaf6da" stroke="#8CC63F" stroke-width="2"/>
  <text x="1115" y="191" text-anchor="middle" font-size="15" fill="#333">Facturation</text>
  <rect x="1060" y="221" width="110" height="44" rx="8" fill="#eaf6da" stroke="#8CC63F" stroke-width="2"/>
  <text x="1115" y="249" text-anchor="middle" font-size="15" fill="#333">Notification</text>

  <path d="M1025,178 L1045,178 L1045,127 L1058,127" fill="none" stroke="#333" stroke-width="2.5" marker-end="url(#fleche)"/>
  <line x1="1025" y1="185" x2="1058" y2="185" stroke="#333" stroke-width="2.5" marker-end="url(#fleche)"/>
  <path d="M1025,192 L1045,192 L1045,243 L1058,243" fill="none" stroke="#333" stroke-width="2.5" marker-end="url(#fleche)"/>

  <text x="895" y="305" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">Chaque abonnement reçoit sa propre copie du message</text>
  <text x="895" y="340" text-anchor="middle" font-size="15" fill="#555">CommandeValidee intéresse trois services aujourd'hui ; demain les</text>
  <text x="895" y="362" text-anchor="middle" font-size="15" fill="#555">statistiques s'abonnent sans que l'émetteur soit modifié ni redéployé.</text>
  <text x="895" y="400" text-anchor="middle" font-size="15" fill="#555">Sémantique naturelle d'un <tspan font-weight="bold">Event Message</tspan> : un fait passé,</text>
  <text x="895" y="422" text-anchor="middle" font-size="15" fill="#555">immuable, que l'émetteur ne cherche pas à faire traiter.</text>

  <!-- Bas -->
  <rect x="60" y="470" width="1080" height="60" rx="10" fill="#f2f5fb" stroke="#4A90D9" stroke-width="2"/>
  <text x="600" y="495" text-anchor="middle" font-size="16" fill="#333">Dans les deux cas : le message est durable tant qu'il n'est pas acquitté, il peut expirer,</text>
  <text x="600" y="518" text-anchor="middle" font-size="16" fill="#333">et un échec répété l'envoie sur une dead letter plutôt que de bloquer le canal.</text>
</svg>
