<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="fleche" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="fleche-bleue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#4A90D9"/>
    </marker>
  </defs>
  <text x="600" y="34" text-anchor="middle" font-size="26" font-weight="bold" fill="#333">Pipeline EF Core : de LINQ au SQL, puis du change tracker à l'UPDATE</text>

  <!-- Lecture -->
  <text x="30" y="74" font-size="17" font-weight="bold" fill="#4A90D9">LECTURE</text>
  <rect x="30" y="86" width="210" height="70" rx="10" fill="#4A90D9" stroke="#333" stroke-width="2"/>
  <text x="135" y="114" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff">Requête LINQ</text>
  <text x="135" y="138" text-anchor="middle" font-size="15" fill="#fff">IQueryable&lt;Commande&gt;</text>

  <line x1="240" y1="121" x2="263" y2="121" stroke="#333" stroke-width="3" marker-end="url(#fleche)"/>
  <rect x="265" y="86" width="210" height="70" rx="10" fill="#f2f5fb" stroke="#4A90D9" stroke-width="2"/>
  <text x="370" y="114" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">Arbre d'expression</text>
  <text x="370" y="138" text-anchor="middle" font-size="15" fill="#555">analyse et paramétrage</text>

  <line x1="475" y1="121" x2="498" y2="121" stroke="#333" stroke-width="3" marker-end="url(#fleche)"/>
  <rect x="500" y="86" width="210" height="70" rx="10" fill="#f2f5fb" stroke="#4A90D9" stroke-width="2"/>
  <text x="605" y="114" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">Compilation en SQL</text>
  <text x="605" y="138" text-anchor="middle" font-size="15" fill="#555">cache selon la forme</text>

  <line x1="710" y1="121" x2="733" y2="121" stroke="#333" stroke-width="3" marker-end="url(#fleche)"/>
  <rect x="735" y="86" width="210" height="70" rx="10" fill="#f2f5fb" stroke="#4A90D9" stroke-width="2"/>
  <text x="840" y="114" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">Exécution ADO.NET</text>
  <text x="840" y="138" text-anchor="middle" font-size="15" fill="#555">DbCommand, DbDataReader</text>

  <line x1="945" y1="121" x2="968" y2="121" stroke="#333" stroke-width="3" marker-end="url(#fleche)"/>
  <rect x="970" y="86" width="210" height="70" rx="10" fill="#4A90D9" stroke="#333" stroke-width="2"/>
  <text x="1075" y="114" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff">Matérialisation</text>
  <text x="1075" y="138" text-anchor="middle" font-size="15" fill="#fff">entités ou DTO projetés</text>

  <!-- Bifurcation -->
  <line x1="1075" y1="156" x2="1075" y2="200" stroke="#333" stroke-width="3"/>
  <line x1="1075" y1="200" x2="330" y2="200" stroke="#333" stroke-width="3"/>
  <line x1="330" y1="200" x2="330" y2="228" stroke="#333" stroke-width="3" marker-end="url(#fleche)"/>
  <line x1="870" y1="200" x2="870" y2="228" stroke="#333" stroke-width="3" marker-end="url(#fleche)"/>

  <rect x="130" y="230" width="400" height="78" rx="10" fill="#8CC63F" stroke="#333" stroke-width="2"/>
  <text x="330" y="258" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff">Suivi (tracking) : le change tracker</text>
  <text x="330" y="281" text-anchor="middle" font-size="15" fill="#fff">identity map + snapshot de chaque valeur</text>
  <text x="330" y="300" text-anchor="middle" font-size="15" fill="#fff">une instance par clé, prête à être modifiée</text>

  <rect x="670" y="230" width="400" height="78" rx="10" fill="#f2f2f2" stroke="#333" stroke-width="2"/>
  <text x="870" y="258" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">AsNoTracking() ou projection Select</text>
  <text x="870" y="281" text-anchor="middle" font-size="15" fill="#555">rien n'est suivi : moins de mémoire, plus vite</text>
  <text x="870" y="300" text-anchor="middle" font-size="15" fill="#555">le bon choix pour les écrans et les exports</text>

  <!-- Écriture -->
  <line x1="330" y1="308" x2="330" y2="366" stroke="#4A90D9" stroke-width="3" marker-end="url(#fleche-bleue)"/>
  <text x="30" y="352" font-size="17" font-weight="bold" fill="#E67E22">ÉCRITURE</text>

  <rect x="30" y="368" width="260" height="72" rx="10" fill="#fdf5ec" stroke="#E67E22" stroke-width="2"/>
  <text x="160" y="396" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Le domaine modifie l'entité</text>
  <text x="160" y="420" text-anchor="middle" font-size="15" fill="#555">commande.Valider(...)</text>

  <line x1="290" y1="404" x2="321" y2="404" stroke="#333" stroke-width="3" marker-end="url(#fleche)"/>
  <rect x="323" y="368" width="260" height="72" rx="10" fill="#fdf5ec" stroke="#E67E22" stroke-width="2"/>
  <text x="453" y="396" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">SaveChanges : DetectChanges</text>
  <text x="453" y="420" text-anchor="middle" font-size="15" fill="#555">compare snapshot et valeur</text>

  <line x1="583" y1="404" x2="614" y2="404" stroke="#333" stroke-width="3" marker-end="url(#fleche)"/>
  <rect x="616" y="368" width="260" height="72" rx="10" fill="#fdf5ec" stroke="#E67E22" stroke-width="2"/>
  <text x="746" y="396" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">INSERT / UPDATE / DELETE</text>
  <text x="746" y="420" text-anchor="middle" font-size="15" fill="#555">colonnes changées, en lot</text>

  <line x1="876" y1="404" x2="907" y2="404" stroke="#333" stroke-width="3" marker-end="url(#fleche)"/>
  <rect x="909" y="368" width="260" height="72" rx="10" fill="#E67E22" stroke="#333" stroke-width="2"/>
  <text x="1039" y="396" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">Transaction, jeton vérifié</text>
  <text x="1039" y="420" text-anchor="middle" font-size="15" fill="#fff">0 ligne touchée = conflit</text>

  <text x="600" y="490" text-anchor="middle" font-size="18" fill="#555">Deux coûts à connaître : la compilation (mitigée par le cache, ou par les requêtes compilées)</text>
  <text x="600" y="516" text-anchor="middle" font-size="18" fill="#555">et le suivi (inutile en lecture seule). Le SaveChanges est l'unité de travail : un cas d'usage, un commit.</text>
</svg>
