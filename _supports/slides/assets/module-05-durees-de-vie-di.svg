<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="Segoe UI, Arial, sans-serif">
  <text x="600" y="34" text-anchor="middle" font-size="26" font-weight="bold" fill="#333">Trois durées de vie : qui vit combien de temps, et le piège de la dépendance captive</text>

  <!-- Axe des requêtes -->
  <text x="140" y="80" text-anchor="end" font-size="16" fill="#555">Temps →</text>
  <rect x="270" y="58" width="280" height="30" rx="6" fill="#f2f2f2" stroke="#999"/>
  <text x="410" y="79" text-anchor="middle" font-size="16" fill="#333">Requête HTTP n° 1 (scanner Lesquin)</text>
  <rect x="570" y="58" width="280" height="30" rx="6" fill="#f2f2f2" stroke="#999"/>
  <text x="710" y="79" text-anchor="middle" font-size="16" fill="#333">Requête HTTP n° 2 (extranet)</text>
  <rect x="870" y="58" width="300" height="30" rx="6" fill="#f2f2f2" stroke="#999"/>
  <text x="1020" y="79" text-anchor="middle" font-size="16" fill="#333">Requête HTTP n° 3 (ADV)</text>

  <!-- Singleton -->
  <rect x="20" y="104" width="230" height="64" rx="8" fill="#333"/>
  <text x="135" y="130" text-anchor="middle" font-size="19" font-weight="bold" fill="#fff">Singleton</text>
  <text x="135" y="154" text-anchor="middle" font-size="15" fill="#fff">une instance pour l'application</text>
  <rect x="270" y="112" width="900" height="48" rx="10" fill="#8CC63F"/>
  <text x="720" y="142" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff">IReferentielArticles (catalogue immuable), IHttpClientFactory, ILogger, IOptions</text>

  <!-- Scoped -->
  <rect x="20" y="186" width="230" height="64" rx="8" fill="#333"/>
  <text x="135" y="212" text-anchor="middle" font-size="19" font-weight="bold" fill="#fff">Scoped</text>
  <text x="135" y="236" text-anchor="middle" font-size="15" fill="#fff">une instance par requête</text>
  <rect x="270" y="194" width="280" height="48" rx="10" fill="#4A90D9"/>
  <text x="410" y="224" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff">CommandesService, DbContext</text>
  <rect x="570" y="194" width="280" height="48" rx="10" fill="#4A90D9"/>
  <text x="710" y="224" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff">CommandesService, DbContext</text>
  <rect x="870" y="194" width="300" height="48" rx="10" fill="#4A90D9"/>
  <text x="1020" y="224" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff">CommandesService, DbContext</text>

  <!-- Transient -->
  <rect x="20" y="268" width="230" height="64" rx="8" fill="#333"/>
  <text x="135" y="294" text-anchor="middle" font-size="19" font-weight="bold" fill="#fff">Transient</text>
  <text x="135" y="318" text-anchor="middle" font-size="15" fill="#fff">une instance par injection</text>
  <rect x="270" y="276" width="132" height="48" rx="10" fill="#E67E22"/>
  <text x="336" y="306" text-anchor="middle" font-size="16" fill="#fff">CalculRemise</text>
  <rect x="418" y="276" width="132" height="48" rx="10" fill="#E67E22"/>
  <text x="484" y="306" text-anchor="middle" font-size="16" fill="#fff">CalculRemise</text>
  <rect x="570" y="276" width="132" height="48" rx="10" fill="#E67E22"/>
  <text x="636" y="306" text-anchor="middle" font-size="16" fill="#fff">Validateur</text>
  <rect x="718" y="276" width="132" height="48" rx="10" fill="#E67E22"/>
  <text x="784" y="306" text-anchor="middle" font-size="16" fill="#fff">Validateur</text>
  <rect x="870" y="276" width="142" height="48" rx="10" fill="#E67E22"/>
  <text x="941" y="306" text-anchor="middle" font-size="16" fill="#fff">CalculRemise</text>
  <rect x="1028" y="276" width="142" height="48" rx="10" fill="#E67E22"/>
  <text x="1099" y="306" text-anchor="middle" font-size="16" fill="#fff">Validateur</text>

  <!-- Séparateur -->
  <line x1="20" y1="352" x2="1180" y2="352" stroke="#ccc" stroke-width="2"/>

  <!-- Dépendance captive -->
  <text x="20" y="384" font-size="20" font-weight="bold" fill="#E67E22">La dépendance captive : un singleton qui garde un scoped</text>

  <rect x="20" y="404" width="560" height="120" rx="12" fill="#fdf5ec" stroke="#E67E22" stroke-width="2"/>
  <rect x="40" y="420" width="240" height="40" rx="8" fill="#8CC63F"/>
  <text x="160" y="446" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">TarifService (singleton)</text>
  <line x1="280" y1="440" x2="330" y2="440" stroke="#333" stroke-width="3"/>
  <polygon points="330,434 342,440 330,446" fill="#333"/>
  <rect x="345" y="420" width="215" height="40" rx="8" fill="#4A90D9"/>
  <text x="452" y="446" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">TrameDbContext (scoped)</text>
  <text x="40" y="486" font-size="15" fill="#333">Le DbContext est créé une fois, gardé pour toute la vie du processus :</text>
  <text x="40" y="508" font-size="15" fill="#333">connexion jamais libérée, change tracker qui grossit, accès concurrents.</text>

  <rect x="610" y="404" width="570" height="120" rx="12" fill="#eaf6da" stroke="#8CC63F" stroke-width="2"/>
  <text x="630" y="432" font-size="17" font-weight="bold" fill="#333">La règle et le filet</text>
  <text x="630" y="458" font-size="15" fill="#333">Un service ne dépend que de services de durée de vie égale ou plus longue.</text>
  <text x="630" y="480" font-size="15" fill="#333">Sinon : IServiceScopeFactory.CreateScope() pour un travail borné,</text>
  <text x="630" y="502" font-size="15" fill="#333">et ValidateScopes / ValidateOnBuild pour que le conteneur refuse de démarrer.</text>

  <text x="600" y="550" text-anchor="middle" font-size="15" fill="#555">En Development, WebApplication.CreateBuilder active ValidateScopes : la captive éclate au premier démarrage, pas en production.</text>
</svg>
